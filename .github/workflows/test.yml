name: Build & Release TVBoxOS Mobile

on:
  push:
    branches:
      - main
      - 'trae/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略上次构建记录，强制重新构建'
        required: false
        type: boolean
      skip_release:
        description: '构建后不创建 Release（只出 Artifact）'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          TAG="$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:'%cd' -1)"
          echo "tag_name=$TAG-$SHORT" >> $GITHUB_OUTPUT
          echo "versionNameSuffix=-$TAG-$SHORT" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare build
        run: |
          # SDK
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          # 签名
          cp .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          {
            echo ""
            echo "RELEASE_STORE_FILE=./TVBoxOSC.jks"
            echo "RELEASE_KEY_ALIAS=TVBoxOSC"
            echo "RELEASE_STORE_PASSWORD=TVBoxOSC"
            echo "RELEASE_KEY_PASSWORD=TVBoxOSC"
          } >> gradle.properties
          # 版本名 + Python 路径
          sed -i "s/versionName '\([^']*\)'/versionName '\1$versionNameSuffix'/g" app/build.gradle
          [ -f pyramid/build.gradle ] && sed -i 's|buildPython("[^"]*")|buildPython("/usr/bin/python3")|' pyramid/build.gradle
          java -version 2>&1
          python3 --version 2>&1 || true

      # ========= 核心构建 =========
      - name: Build all release APKs
        run: |
          chmod +x gradlew
          # 逐个跑，避免某个 flavor 挂了整个 gradlew 中断
          set +e
          for variant in JavaRelease Java32Release Java64Release PythonRelease Python32Release Python64Release; do
            echo ""
            echo "========= 🔨 assemble${variant} ========="
            ./gradlew "assemble${variant}" \
              --no-daemon --stacktrace --console=plain \
              2>&1 | tee build_${variant}.log | tail -20
            EXIT=$?
            echo "exit=$EXIT"
            if [ $EXIT -ne 0 ]; then
              echo "❌ assemble${variant} FAILED — full log saved to build_${variant}.log"
            else
              echo "✅ assemble${variant} OK"
            fi
          done
          # 汇总
          echo ""
          echo "===== 🔍 所有 APK ====="
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null
          echo ""
          echo "===== 🔍 所有 BUILD FAILED 摘要 ====="
          for variant in JavaRelease Java32Release Java64Release PythonRelease Python32Release Python64Release; do
            if grep -q "BUILD FAILED" build_${variant}.log 2>/dev/null; then
              echo "❌ $variant: === last 40 lines ==="
              tail -40 build_${variant}.log
              echo ""
              echo "❌ $variant: === grep Error/Exception ==="
              grep -n -i -E "FAILURE|Manifest merger|error:|Exception|Unresolved reference|uses-sdk" build_${variant}.log | head -30
              echo "---"
            fi
          done
          echo "===== 汇总 END ====="

      # ========= 收集 APK =========
      - name: Collect APK artifacts
        run: |
          rm -rf apk/
          mkdir -p apk/
          # Gradle 标准输出路径: app/build/outputs/apk/<flavor>/<type>/TVBox_<type>-<flavor>.apk
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | while read -r src; do
            [ -f "$src" ] || continue
            base=$(basename "$src")
            case "$base" in
              TVBox_*.apk)
                new=$(echo "$base" | sed "s/release/${{ steps.version.outputs.tag_name }}/")
                cp "$src" "apk/$new" && echo "✅ $base → $new"
                ;;
              *) echo "⏭ skip: $base" ;;
            esac
          done
          echo ""
          ls -lh apk/ || true

      # ========= 日志 artifacts（无论构建成败都上传）=========
      - name: Upload Build Logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.tag_name }}
          path: build_*.log
          if-no-files-found: warn

      # ========= APK artifacts =========
      - name: Upload APK Artifact
        run: |
          if [ -z "$(ls apk/ 2>/dev/null)" ]; then
            echo "❌ 零 APK 产出！"
            exit 1
          fi
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Mobile-${{ steps.version.outputs.tag_name }}
          path: apk/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ steps.version.outputs.tag_name }}
          name: TVBoxOS Mobile v${{ steps.version.outputs.tag_name }}
          files: apk/*
          generate_release_notes: true
          prerelease: false
          body: |
            ## 📱 TVBoxOS 手机版 —— 阶段 0 构建

            - **提交**: `${{ github.sha }}`
            - **minSdk**: 21（全部 6 个 flavors 统一）
            - **Compose**: BOM 2023.06.00 + Material3 + Navigation Compose
            - **打包**: java / java32 / java64 / python / python32 / python64
