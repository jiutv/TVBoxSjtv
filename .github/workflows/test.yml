name: Build & Release TVBoxOS Mobile

on:
  push:
    branches:
      - main
      - 'trae/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略上次构建记录，强制重新构建'
        required: false
        type: boolean
      skip_release:
        description: '构建后不创建 Release（只出 Artifact）'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          TAG="$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:'%cd' -1)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "tag_name=$TAG-$SHORT" >> $GITHUB_OUTPUT
          echo "SUFFIX=-$TAG-$SHORT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - uses: gradle/actions/setup-gradle@v3

      - name: Prepare build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cp .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          {
            echo ""
            echo "RELEASE_STORE_FILE=./TVBoxOSC.jks"
            echo "RELEASE_KEY_ALIAS=TVBoxOSC"
            echo "RELEASE_STORE_PASSWORD=TVBoxOSC"
            echo "RELEASE_KEY_PASSWORD=TVBoxOSC"
          } >> gradle.properties
          sed -i "s/versionName '\([^']*\)'/versionName '\1$SUFFIX'/g" app/build.gradle
          [ -f pyramid/build.gradle ] && sed -i 's|buildPython("[^"]*")|buildPython("/usr/bin/python3")|' pyramid/build.gradle || true

      - name: Build APKs (one Gradle invocation)
        run: |
          chmod +x gradlew
          ./gradlew \
            assembleJavaRelease \
            assembleJava32Release \
            assembleJava64Release \
            assemblePythonRelease \
            assemblePython32Release \
            assemblePython64Release \
            --no-daemon --stacktrace --console=plain

      - name: Collect APKs
        run: |
          rm -rf apk/
          mkdir -p apk/
          # Gradle 标准输出路径 —— 直接列出来给你看
          echo "=== Gradle 输出树 (app/build/outputs/apk) ==="
          find app/build/outputs/apk -type f 2>/dev/null || echo "(no outputs dir yet)"
          echo ""
          echo "=== 全仓库搜 *.apk ==="
          find . -not -path "./.git/*" -not -path "./apk/*" -name "*.apk" 2>/dev/null
          echo ""
          # 精准 cp：按 productFlavor 一个个找
          APK_COUNT=0
          for FLAVOR in java java32 java64 python python32 python64; do
            SRC="app/build/outputs/apk/${FLAVOR}/release/TVBox_release-${FLAVOR}.apk"
            NEW="apk/TVBox_${SUFFIX}-${FLAVOR}.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$NEW"
              APK_COUNT=$((APK_COUNT+1))
              echo "✅ $FLAVOR: cp $SRC → $NEW"
            else
              # fallback —— 在 apk 目录下搜任意包含该 flavor 名的 apk
              FALLBACK=$(find app/build/outputs/apk -type f -name "*${FLAVOR}*.apk" 2>/dev/null | head -1)
              if [ -n "$FALLBACK" ] && [ -f "$FALLBACK" ]; then
                cp "$FALLBACK" "$NEW"
                APK_COUNT=$((APK_COUNT+1))
                echo "🔄 $FLAVOR (fallback): cp $FALLBACK → $NEW"
              else
                echo "❌ $FLAVOR: APK not found at $SRC"
              fi
            fi
          done
          echo ""
          echo "=== Final apk/ ==="
          ls -lh apk/
          echo "APK_COUNT=$APK_COUNT"
          [ $APK_COUNT -gt 0 ] || exit 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Mobile-${{ steps.version.outputs.tag_name }}
          path: apk/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.skip_release != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ steps.version.outputs.tag_name }}
          name: TVBoxOS Mobile v${{ steps.version.outputs.tag_name }}
          files: apk/*
          generate_release_notes: true
          prerelease: false
          body: |
            ## TVBoxOS 手机版 Compose 改造 —— 阶段 0 构建

            - **提交**: `${{ github.sha }}`
            - **构建**: GitHub Actions (ubuntu-latest + JDK 17 + Android SDK 33)
            - **Flavors**: java / java32 / java64 / python / python32 / python64
            - **minSdk**: 21

  cleanup:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
