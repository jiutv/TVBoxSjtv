name: Build & Release TVBoxOS Mobile

on:
  push:
    branches:
      - main
      - 'trae/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略上次构建记录，强制重新构建'
        required: false
        type: boolean
      skip_release:
        description: '构建后不创建 Release（只出 Artifact）'
        required: false
        type: boolean

env:
  USER_NAME: jiutv
  REPO_NAME: TVBoxSjtv

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          TAG="$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:'%cd' -1)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "tag_name=$TAG-$SHORT" >> $GITHUB_OUTPUT
          echo "versionNameSuffix=-$TAG-$SHORT" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties

      - name: Apply signing config
        run: |
          # 把仓库自带的签名文件复制到 app/
          cp .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          # 在 gradle.properties 末尾追加 signing 属性
          {
            echo ""
            echo "RELEASE_STORE_FILE=./TVBoxOSC.jks"
            echo "RELEASE_KEY_ALIAS=TVBoxOSC"
            echo "RELEASE_STORE_PASSWORD=TVBoxOSC"
            echo "RELEASE_KEY_PASSWORD=TVBoxOSC"
          } >> gradle.properties
          echo "=== gradle.properties tail ==="
          tail -10 gradle.properties

      - name: Patch versionName with build tag
        run: |
          # 把 app/build.gradle 里 versionName '1.0.0' 改成带 tag 的版本名
          # $versionNameSuffix 已在上一步 echo >> $GITHUB_ENV，形如 -20261103-0330-abcdefg
          sed -i "s/versionName '\([^']*\)'/versionName '\1$versionNameSuffix'/g" app/build.gradle
          echo "=== patched versionName ==="
          grep -n "versionName" app/build.gradle

      - name: Patch Python path for Linux CI
        run: |
          # Chaquo Python 在 Linux runner 上需要显式指定 python3 路径
          if [ -f pyramid/build.gradle ]; then
            sed -i 's|buildPython("[^"]*")|buildPython("/usr/bin/python3")|' pyramid/build.gradle
          fi

      - name: Build environment info
        run: |
          echo "Java:" && java -version 2>&1
          echo "Python:" && python3 --version 2>&1 || echo "no python3"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build APKs + Collect
        run: |
          chmod +x gradlew
          # ===== Phase 1: 逐个 flavor 构建 =====
          set +e
          FAILED=0
          for VARIANT in JavaRelease Java32Release Java64Release PythonRelease Python32Release Python64Release; do
            echo ""
            echo "========== 🔨 assemble${VARIANT} =========="
            ./gradlew "assemble${VARIANT}" \
              --no-daemon --stacktrace --console=plain \
              2>&1 | tee "build_${VARIANT}.log" | tail -15
            EXIT=$?
            if [ $EXIT -ne 0 ]; then
              FAILED=$((FAILED+1))
              echo "❌ assemble${VARIANT} FAILED (exit=$EXIT)"
              tail -50 "build_${VARIANT}.log"
            else
              echo "✅ assemble${VARIANT} OK"
            fi
          done

          # ===== Phase 2: 全局搜 APK + 额外诊断 =====
          echo ""
          echo "========== 🔍 FIND ALL APKS ==========" | tee -a build_summary.txt
          echo "--- tree app/build/outputs/apk ---" | tee -a build_summary.txt
          find app/build/outputs -type f -print 2>/dev/null | tee -a build_summary.txt
          echo "--- all apk in repo (maxdepth 8, 除 .git) ---" | tee -a build_summary.txt
          find . -maxdepth 8 -type f -name "*.apk" -not -path "./.git/*" 2>/dev/null | tee apk_paths.txt | tee -a build_summary.txt
          echo "" | tee -a build_summary.txt
          echo "=== apk_paths.txt contents ===" | tee -a build_summary.txt
          cat apk_paths.txt 2>/dev/null | tee -a build_summary.txt || echo "(empty)" | tee -a build_summary.txt
          echo "=== apk_paths.txt count: $(wc -l < apk_paths.txt 2>/dev/null || echo 0) ===" | tee -a build_summary.txt

          # 也列一下所有 flavor build 目录
          echo "--- list app/build/intermediates ---" | tee -a build_summary.txt
          find app/build -maxdepth 4 -name "outputs" -type d 2>/dev/null | tee -a build_summary.txt || true

          # ===== Phase 3: 复制 + 重命名 =====
          rm -rf apk/
          mkdir -p apk/
          SUFFIX="${{ steps.version.outputs.tag_name }}"
          cp_n=0
          # 先按标准 Gradle 命名找（更精准）
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | while IFS= read -r src; do
            base=$(basename "$src")
            new=$(echo "$base" | sed "s/release/$SUFFIX/")
            if cp "$src" "apk/$new" 2>/dev/null; then
              echo "✅ COPY: $src → apk/$new" | tee -a build_summary.txt
            else
              echo "❌ COPY FAIL: $src" | tee -a build_summary.txt
            fi
          done
          cp_n=$(ls apk/ 2>/dev/null | wc -l)
          echo "" | tee -a build_summary.txt
          echo "========== 📂 FINAL apk/ (cp_n=$cp_n) ==========" | tee -a build_summary.txt
          ls -lh apk/ 2>/dev/null | tee -a build_summary.txt || echo "(empty)" | tee -a build_summary.txt
          echo "" | tee -a build_summary.txt
          echo "========== 📋 FAILED=$FAILED  APK_COUNT=$cp_n ==========" | tee -a build_summary.txt
          # 这里永远 exit 0 —— 让 Upload Artifact 根据 if-no-files-found: error 来决定成败
          exit 0

      - name: Upload Build Logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.tag_name }}
          path: |
            build_*.log
            build_summary.txt
            apk_paths.txt
          if-no-files-found: warn

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Mobile-${{ steps.version.outputs.tag_name }}
          path: apk/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.skip_release != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ steps.version.outputs.tag_name }}
          name: TVBoxOS Mobile v${{ steps.version.outputs.tag_name }}
          files: apk/*
          generate_release_notes: true
          prerelease: false
          body: |
            ## 📱 TVBoxOS 手机版 Compose 改造 —— 阶段 0 构建

            - **提交**: `${{ github.sha }}`
            - **分支**: `main`
            - **构建**: GitHub Actions (ubuntu-latest + JDK 17 + Android SDK 33)
            - **打包全部 flavors**: java / java32 / java64 / python / python32 / python64

            ### 阶段 0 已完成
            - ✅ Jetpack Compose BOM 引入（2023.06.00 + Kotlin 1.8.22）
            - ✅ 新增 `MainActivity.kt` + Material3 主题
            - ✅ Manifest 全部 Activity 改 `sensorPortrait`
            - ✅ 移除 LEANBACK_LAUNCHER、leanback required=true
            - ✅ 旧 Activity 暂时保留 `enabled=false`（等阶段 1-3 全部 Compose 化后移除）
            - ✅ tv-recyclerview 过渡保留（旧 Java Activity 编译依赖）

            ### 后续阶段
            - 阶段 1: 首页 HomeScreen（ScrollableTabRow + Compose 网格）
            - 阶段 2: 详情页 + 播放器（AndroidView 嵌入 VideoView + Compose 控制层）
            - 阶段 3: 收藏 / 历史 / 设置 / 搜索 / 直播

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts (>14 days)
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
