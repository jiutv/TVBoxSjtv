name: Build & Release TVBoxOS Mobile

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录，强制重新构建'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          TAG="$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:'%cd' -1)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "tag=$TAG-$SHORT" >> $GITHUB_OUTPUT
          echo "tag=$TAG-$SHORT" >> $GITHUB_ENV

      - name: Setup Java 17 (for sdkmanager)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.2"

      - name: Setup Java 11 (for Gradle build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Pre-download Gradle 7.5 (mirror fallback)
        run: |
          GRADLE_VER="gradle-7.5-bin"
          GRADLE_HOME="$HOME/.gradle/wrapper/dists/$GRADLE_VER"
          HASH_DIR=$(echo -n "https://services.gradle.org/distributions/$GRADLE_VER.zip" | sha256sum | cut -c1-8)
          TARGET="$GRADLE_HOME/$HASH_DIR"
          if [ -d "$TARGET/gradle-7.5" ]; then
            echo "✅ Gradle 7.5 已存在"
          else
            mkdir -p "$TARGET"
            cd "$TARGET"
            for url in \
              "https://services.gradle.org/distributions/$GRADLE_VER.zip" \
              "https://mirrors.cloud.tencent.com/gradle/$GRADLE_VER.zip" \
              "https://mirrors.tuna.tsinghua.edu.cn/gradle/$GRADLE_VER.zip" \
              "https://mirrors.huaweicloud.com/gradle/$GRADLE_VER.zip"; do
              echo "  trying: $url"
              if curl -fsSL --connect-timeout 10 -o "$GRADLE_VER.zip" "$url"; then
                echo "✅ download ok: $url"
                break
              fi
            done
            unzip -q "$GRADLE_VER.zip"
            rm -f "$GRADLE_VER.zip"
            echo "✅ Gradle 7.5 ready"
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.m2/repository
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cp .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          {
            echo ""
            echo "RELEASE_STORE_FILE=./TVBoxOSC.jks"
            echo "RELEASE_KEY_ALIAS=TVBoxOSC"
            echo "RELEASE_STORE_PASSWORD=TVBoxOSC"
            echo "RELEASE_KEY_PASSWORD=TVBoxOSC"
          } >> gradle.properties
          sed -i '/^#org.gradle.jvmargs/s/^#//' gradle.properties
          sed -i "s/versionName '\([^']*\)'/versionName '\1-$tag'/g" app/build.gradle
          echo "local.properties:" && cat local.properties
          echo "=== gradle.properties tail ===" && tail -10 gradle.properties

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          mkdir -p build_logs
          FAILED=0
          # python/python32/python64 需要 pyramid 模块（settings.gradle 注释掉了 chaquo/pyramid），
          # 暂时只构建 java 系列 3 个 flavor，与原始项目 release 脚本一致
          set -o pipefail
          for flavor in java java32 java64; do
            echo ""
            echo "===== Building flavor: $flavor ====="
            if ./gradlew "assemble${flavor^}Release" \
              --no-build-cache --stacktrace --warning-mode all 2>&1 | tee "build_logs/${flavor}.log"; then
              echo "✅ $flavor OK"
            else
              echo "❌ $flavor FAILED (exit code $?)"
              echo ""
              echo "=== 🚨 BUILD RESULT ==="
              grep -E "BUILD SUCCESSFUL|BUILD FAILED" "build_logs/${flavor}.log" | tail -1 || true
              echo ""
              echo "=== 🚨 REAL ERRORS (e: / error: lines) ==="
              grep -nE "^e:| error:" "build_logs/${flavor}.log" | head -80 || echo "(no error lines found)"
              echo ""
              echo "=== 🚨 Last 30 lines ==="
              tail -30 "build_logs/${flavor}.log"
              FAILED=$((FAILED+1))
            fi
          done
          echo ""
          echo "===== RESULT: $((3-FAILED))/3 ====="
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Prepare App (Collect APKs)
        run: |
          rm -rf apk/
          mkdir -p apk/
          echo "===== 🔍 Searching APKs ====="
          echo "=== app/build/outputs/apk ==="
          find app/build/outputs/apk -name "*.apk" -print 2>/dev/null || echo "(no outputs dir)"
          echo "=== find ~ ==="
          find ~ -name "*release*.apk" -print 2>/dev/null
          echo "=== find . ==="
          find . -name "*.apk" -print 2>/dev/null
          echo ""
          echo "===== 开始复制 ====="
          for file in $(find app/build/outputs/apk -name "*.apk" -print 2>/dev/null; find ~ -name "*release*.apk" -print 2>/dev/null); do
            base=$(basename "$file")
            echo "  找到: $file  →  base=$base"
            if [[ "$base" == TVBox_* ]]; then
              new_base=$(echo "$base" | sed "s/release/$tag/")
            else
              new_base="TVBox_$tag.apk"
            fi
            cp "$file" "apk/$new_base"
          done
          echo ""
          echo "===== apk/ 最终 ====="
          ls -la apk/
          APK_COUNT=$(ls apk/*.apk 2>/dev/null | wc -l)
          echo "APK_COUNT=$APK_COUNT"
          [ "$APK_COUNT" -gt 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVBoxOS-Mobile-$tag
          path: |
            apk/*
            build_logs/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la apk/
          gh release create "mobile-$tag" apk/*.apk \
            --title "TVBoxOS Mobile $tag" \
            --target "${{ github.sha }}" \
            --latest

  cleanup:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
