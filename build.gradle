// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        // ⚠️ AGP 在 Google Maven，Kotlin Gradle Plugin 在 Gradle Plugin Portal
        // 顺序：能通的镜像在前，容易 429/404 的在后
        google()                                          // AGP 从这里拿 ✅
        maven { url "https://repo.huaweicloud.com/repository/maven" }  // 华为云（代理 Google + Central）✅
        maven { url "https://maven.aliyun.com/repository/google" }     // 阿里云 Google 镜像
        maven { url "https://maven.aliyun.com/repository/central" }    // 阿里云 Central 镜像 ✅
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://jitpack.io" }
        maven { url "https://storage.googleapis.com/r8-releases/raw" }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
        maven { url "https://chaquo.com/maven" }
        // Gradle Plugin Portal（可能 429，放在最后）
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
        // pyramid 模块已注释（settings.gradle），chaquo 插件不再需要
        // classpath "com.chaquo.python:gradle:12.0.1"
    }
}

allprojects {
    repositories {
        // 运行时依赖仓库顺序（同上策略）
        google()
        maven { url "https://repo.huaweicloud.com/repository/maven" }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/central" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
        maven { url "https://jitpack.io" }
        gradlePluginPortal()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
